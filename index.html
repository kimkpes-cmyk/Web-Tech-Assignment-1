<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration Form</title>
</head>
<body>
    <h2>User Registration Form</h2>

    <form action="#" method="POST">
        <label for="name">FirstName:</label> <br>
        <input type="text" id="FirstName" name="name" required><br>

        <label for="name">LastName:</label> <br>
        <input type="text" id="LastName" name="name" required><br>

        <label for="email">Email</label><br>
        <input type="email" id="email" name="email" required><br>

        <label for="password">Password</label><br>
        <input type="password" id="password" name="password" minlength="6" required><br>

        <label>Gender</label><br>
        <input type="radio" id="male" name="gender" value="male">
        <label for="gender">Male</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="gender">Female</label><br>

        <label >Interests</label><br>
        <input type="checkbox" id="sports" name="interests" value="sports">
        <label for="interests">sports</label><br>

        <input type="checkbox" id="music" name="interests" value="music" >
        <label for="interests">Music</label><br>

        <input type="checkbox" id="reading" name="interests" value="reading">
        <label for="interests">Reading</label><br>

        <input type="submit" value="Submit">



</form>
</body>
</html>
